name: Test plugin

on:
    pull_request:
        branches:
            - main
        paths-ignore:
            - "**/*.md"

permissions:
    contents: read

env:
    DOCKER_IMAGE: qgis/qgis

jobs:
    Test-plugin:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                docker_tags: ["3.44", "4.0-trixie"]

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Export requirements.txt
              run: |
                  pip3 install uv
                  uv export -o requirements.txt --no-dev --no-hashes

            - name: Docker pull QGIS
              run: |
                  docker pull "$DOCKER_IMAGE":${{ matrix.docker_tags }}

            - name: Run tests
              run: |
                  docker run --rm \
                    -v "${{ github.workspace }}":/plugin \
                    -w /plugin \
                    "$DOCKER_IMAGE":${{ matrix.docker_tags }} \
                    sh -c "
                      pip3 install --break-system-packages pytest pytest-qgis -r requirements.txt &&
                      xvfb-run -s '+extension GLX -screen 0 1024x768x24' \
                        python3 -m pytest tests/ -v
                    "
