[project]
name = "gtfsgo"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MIERUNE Inc.", email = "info@mierune.co.jp" }]

[dependency-groups]
dev = ["pyqt5-stubs>=5.15.6.0", "ruff>=0.8.2", "pandas>=2.2.2"]

[tool.ruff]
lint.select = ["F", "E", "W", "B", "C90", "N", "I"]
