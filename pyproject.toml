[project]
name = "gtfs-go"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Kanahiro", email = "mediterranean1769@gmail.com"},
]
dependencies = [
    "pandas>=2.2.2",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pyqt5-stubs>=5.15.6.0",
    "pytest>=7.0",
    "pytest-qgis>=2.0",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# gtfs_parser is a git submodule (linted in its own repository)
extend-exclude = ["gtfs_parser"]
lint.select = ["F", "E", "W", "B", "C90", "N", "I"]
lint.ignore = ["N999", "N802", "F401", "E501", "N806", "C901", "N803", "N815", "B018"]
target-version = "py39"

[tool.bandit]
# gtfs_parser is a git submodule, but its source is shipped with the plugin,
# so it is scanned here too. Only test code is excluded.
exclude_dirs = ["tests", ".venv"]
